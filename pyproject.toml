[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "streamguard"
version = "0.1.0"
description = "Real-time payment fraud signals: Kafka, Spark Structured Streaming, PostgreSQL, Superset"
requires-python = ">=3.13,<3.14"
# Dependencies live in requirements.txt / requirements-spark.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Plain `pytest` runs unit tests only; CI selects marked tests explicitly.
addopts = "-m \"not spark and not kafka and not integration\""
markers = [
    "spark: needs pyspark and Java 17 (PC 1 or CI only)",
    "kafka: needs a running Kafka broker",
    "integration: needs running PostgreSQL (POSTGRES_TEST_DB) and/or other services",
]
